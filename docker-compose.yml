services:
  social-downloader:
    image: ghcr.io/nikolainyegaard/social-downloader:latest
    container_name: social-downloader
    restart: unless-stopped

    volumes:
      # Database and cookies.txt are stored here - back this up.
      - ./data:/app/data
      # Downloaded media (videos, photos) are stored here.
      - ./media:/app/media
      # Per-platform storage overrides: mount another disk over a platform's
      # subfolder to keep its media there. The container path must stay
      # /app/media/<platform> so nothing else changes; move the existing
      # files onto the disk before switching (see README).
      # - /mnt/bigdisk/tiktok:/app/media/tiktok
      # - /mnt/bigdisk/youtube:/app/media/youtube
      # - /mnt/bigdisk/twitter:/app/media/twitter
      # - /mnt/bigdisk/instagram:/app/media/instagram
      # - /mnt/bigdisk/onlyfans:/app/media/onlyfans
      # Optional: lets the app restart the gluetun VPN container from
      # Settings > Network > TikTok after saving a WireGuard config.
      # Note that the socket gives this container control over the host's
      # Docker daemon, so leave it out if you do not use the gluetun setup.
      # - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TZ: "Europe/Oslo"                           # set your timezone so log timestamps are in local time
      # Loop intervals are configurable from Settings in the UI and do not need to be set here.
      # WEB_PORT: "5000"         # change if needed (also update the ports below)
      # MEDIA_DIR: /app/media  # override media storage path inside the container

      # OAuth is configured via Settings > Authentication in the UI, not here.
      # Emergency escape hatch: uncomment the line below if you are locked out because
      # the OIDC provider is unreachable. This bypasses auth so you can fix the config.
      # OAUTH_FORCE_DISABLE: "true"

    # Bind only to localhost so Caddy (running on the host) can reach the service
    # but it is not directly exposed to the internet.
    #
    # Caddyfile reverse_proxy entry:
    #   reverse_proxy localhost:5000
    #
    # If Caddy is also a Docker container on the same host, put both services on
    # a shared network instead and reference the service name as the upstream:
    #   reverse_proxy social-downloader:5000
    # Then remove the `ports` block below and use `expose` instead.
    ports:
      - "127.0.0.1:5000:5000"
